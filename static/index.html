<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMB Solutions ERPNext AI Reports</title>
    <!-- Google Fonts: Inter for clean, modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=7">
    <!-- Chart.js for Dashboards -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Overlay for Sidebar on Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Saved Reports</h2>
            <button class="close-sidebar-btn" id="close-sidebar-btn" title="Close Sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-panel-left-close">
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M9 3v18" />
                    <path d="m16 15-3-3 3-3" />
                </svg>
            </button>
        </div>
        <div class="sidebar-new-chat">
            <button class="new-chat-btn" id="new-chat-btn" title="New Chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14" />
                    <path d="M5 12h14" />
                </svg>
                New Chat
            </button>
        </div>
        <div class="saved-reports-list" id="saved-reports-list">
            <!-- Saved reports will be populated here -->
        </div>
    </aside>

    <main class="app-container">
        <button class="open-sidebar-btn" id="open-sidebar-btn" title="Open Saved Reports">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-panel-left-open">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M9 3v18" />
                <path d="m14 9 3 3-3 3" />
            </svg>
        </button>
        <!-- Chat History / Results Area -->
        <div id="results-area" class="results-area">
            <!-- Dynamic content will be appended here -->
        </div>
        <!-- Prompt Area (Initially centered, moves to bottom) -->
        <div id="prompt-area" class="prompt-area prompt-centered">
            <header class="welcome-header" id="welcome-header">
                <h1>SMB Solutions ERPNext AI Reports</h1>
                <p>Generate dynamic ERP reports effortlessly using plain English.</p>
            </header>

            <form id="prompt-form" autocomplete="off" class="prompt-form">
                <div class="input-wrapper">
                    <textarea id="user-prompt" placeholder="Message ERPNEXT AI ..." rows="1" required></textarea>
                    <button type="submit" id="generate-btn" class="send-btn" title="Send message">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-arrow-up">
                            <path d="m5 12 7-7 7 7" />
                            <path d="M12 19V5" />
                        </svg>
                        <div class="spinner hidden" id="loading-spinner"></div>
                    </button>
                </div>
                <div class="disclaimer">ERPNEXT AI can make mistakes. Consider verifying important information.
                </div>
            </form>
        </div>
    </main>

    <!-- Template for a user message -->
    <template id="user-message-template">
        <div class="message user-message">
            <div class="avatar">U</div>
            <div class="message-content"></div>
        </div>
    </template>

    <!-- Template for an AI response -->
    <template id="ai-response-template">
        <div class="message ai-message">
            <div class="avatar ai-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-sparkles">
                    <path
                        d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
                    <path d="M20 3v4" />
                    <path d="M22 5h-4" />
                    <path d="M4 17v2" />
                    <path d="M5 18H3" />
                </svg>
            </div>
            <div class="message-content w-full">
                <section class="sql-section hidden">
                    <div class="section-header">
                        <h2>Generated SQL</h2>
                        <button class="icon-btn copy-btn" title="Copy SQL">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-copy">
                                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                            </svg>
                        </button>
                    </div>
                    <pre><code class="sql-output"></code></pre>
                </section>

                <section class="data-section hidden">
                    <div class="section-header collapsible-header">
                        <div class="section-title-group">
                            <button class="collapse-toggle-btn" title="Collapse/Expand Table">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="chevron-icon">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                            <span class="section-title">Results Data</span>
                        </div>
                        <div class="header-actions">
                            <span class="row-count">0 rows</span>
                            <button class="export-btn" title="Export as CSV">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-download">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="7 10 12 15 17 10" />
                                    <line x1="12" x2="12" y1="15" y2="3" />
                                </svg>
                            </button>
                            <button class="dashboard-btn" title="Generate Dashboard">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-bar-chart-3">
                                    <path d="M3 3v18h18" />
                                    <rect width="4" height="7" x="7" y="10" rx="1" />
                                    <rect width="4" height="12" x="15" y="5" rx="1" />
                                </svg>
                            </button>
                            <button class="save-report-btn" title="Save Report & Dashboard">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-bookmark">
                                    <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="collapsible-body">
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead class="data-thead"></thead>
                                <tbody class="data-tbody"></tbody>
                            </table>
                        </div>
                        <div class="chart-container" style="display: none; margin-top: 20px;">
                            <canvas class="dashboard-chart"></canvas>
                        </div>
                    </div>
                </section>

                <div class="error-toast hidden"></div>
            </div>
        </div>
    </template>

    <!-- Custom Modals -->
    <div id="modal-backdrop" class="modal-backdrop hidden"></div>

    <!-- Custom Prompt Modal -->
    <div id="custom-prompt-modal" class="modal-box hidden">
        <h3 id="prompt-modal-title">Enter Value</h3>
        <p id="prompt-modal-message"></p>
        <input type="text" id="prompt-modal-input" class="modal-input" autocomplete="off" />
        <div class="modal-actions">
            <button id="prompt-modal-cancel" class="btn-secondary">Cancel</button>
            <button id="prompt-modal-submit" class="btn-primary">Save</button>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="custom-confirm-modal" class="modal-box hidden">
        <h3 id="confirm-modal-title">Confirm Action</h3>
        <p id="confirm-modal-message"></p>
        <div class="modal-actions">
            <button id="confirm-modal-cancel" class="btn-secondary">Cancel</button>
            <button id="confirm-modal-submit" class="btn-danger">Delete</button>
        </div>
    </div>

    <script src="/static/app.js?v=4"></script>
</body>

</html>
