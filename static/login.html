<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERPNext AI Reports</title>
    <!-- Use standard Frappe/ERPNext-like stack font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-body: #f4f5f6;
            --bg-card: #ffffff;
            --text-heading: #171717;
            --text-body: #171717;
            --text-muted: #8d99a6;
            --border-color: #d1d8dd;
            --input-bg: #f4f5f6;
            --input-bg-focus: #ebeef0;
            --btn-dark: #171717;
            --btn-light: #f4f5f6;
            --btn-light-hover: #ebeef0;
            --brand-blue: #0070bc;
            --focus-ring: rgba(119, 178, 222, 0.5);
            /* Frappe's blueish outline */
            --error-color: #e35a51;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-nav {
            width: 100%;
            height: 48px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            box-sizing: border-box;
        }

        .header-nav span {
            font-size: 0.9rem;
            color: var(--text-body);
            font-weight: 400;
        }

        .login-wrapper {
            margin-top: 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            background-color: var(--btn-dark);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-heading);
            margin: 0 0 1.5rem 0;
        }

        .login-card {
            background: var(--bg-card);
            border-radius: 8px;
            width: 100%;
            padding: 2.5rem 2rem;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        /* Match the light blue input boxes from Frappe */
        .frappe-input {
            width: 100%;
            border: 1px solid transparent;
            /* Frappe typically uses light bg and no border until focus */
            background-color: #e5f1fa;
            /* Similar to the screenshot */
            color: var(--text-body);
            font-size: 0.85rem;
            font-family: inherit;
            padding: 0.7rem 1rem 0.7rem 2.25rem;
            /* Space for icon */
            border-radius: 6px;
            transition: all 0.2s;
            box-sizing: border-box;
            outline: none;
        }

        .frappe-input:focus {
            background-color: #ffffff;
            border-color: #92c4e7;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .frappe-input::placeholder {
            color: #5d7589;
        }

        .input-icon {
            position: absolute;
            left: 0.75rem;
            color: #5d7589;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .input-icon svg {
            width: 16px;
            height: 16px;
        }

        .show-pwd {
            position: absolute;
            right: 0.75rem;
            font-size: 0.75rem;
            color: #5d7589;
            cursor: pointer;
            user-select: none;
        }

        .forgot-pwd {
            text-align: right;
            font-size: 0.75rem;
            color: #5d7589;
            margin-top: -0.25rem;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: inherit;
        }

        .btn-black {
            background-color: var(--btn-dark);
            color: white;
            margin-top: 0.5rem;
        }

        .btn-black:hover {
            opacity: 0.9;
        }

        .btn-black:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0.25rem 0;
            position: relative;
        }

        .btn-email {
            background-color: var(--btn-light);
            color: var(--text-body);
            border: 1px solid transparent;
        }

        .btn-email:hover {
            background-color: var(--btn-light-hover);
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.5rem;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <div class="header-nav">
        <span>Home</span>
    </div>

    <div class="login-wrapper">
        <div class="logo-box">E</div>
        <h1>Login to Frappe</h1>

        <form class="login-card" id="login-form">
            <div class="input-group">
                <span class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </span>
                <input type="text" id="client_id" class="frappe-input" placeholder="Workspace ID" required
                    autocomplete="organization">
            </div>

            <div class="input-group">
                <span class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>
                </span>
                <input type="text" id="username" class="frappe-input" placeholder="Administrator@gmail.com" required
                    autocomplete="username">
            </div>

            <div class="input-group">
                <span class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </span>
                <input type="password" id="password" class="frappe-input" placeholder="••••••••" required
                    autocomplete="current-password">
                <span class="show-pwd" id="toggle-pwd">Show</span>
            </div>

            <div class="forgot-pwd">Forgot Password?</div>

            <button type="submit" class="btn btn-black" id="login-btn">
                Login
            </button>
            <div class="error-msg" id="login-error"></div>

            <div class="divider">or</div>

            <button type="button" class="btn btn-email">
                Login with Email Link
            </button>
        </form>
    </div>

    <script>
        // Use an IIFE or normal script
        if (localStorage.getItem('auth_token')) {
            window.location.href = 'index.html';
        }

        const togglePwd = document.getElementById('toggle-pwd');
        const pwdInput = document.getElementById('password');

        togglePwd.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                togglePwd.textContent = 'Hide';
            } else {
                pwdInput.type = 'password';
                togglePwd.textContent = 'Show';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const clientId = document.getElementById('client_id').value.trim();
            const password = pwdInput.value;
            const errorDiv = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-btn');

            errorDiv.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, client_id: clientId })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user_email', data.email);
                    localStorage.setItem('client_id', clientId);

                    submitBtn.textContent = 'Success';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    const error = await res.json();
                    errorDiv.textContent = error.detail || 'Invalid credentials';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>

</html>
